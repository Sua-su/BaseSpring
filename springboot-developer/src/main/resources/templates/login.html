<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="mb-4">로그인</h2>
            <form action="/login" method="post">
                <div class="form-group">
                    <label for="username">이메일</label>
                    <input type="email" class="form-control" id="username" name="username" placeholder="이메일 입력" required>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호 입력" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">로그인</button>
            </form>
            <p class="mt-3">계정이 없으신가요? <a th:href="@{/signup}">회원가입</a></p>
        </div>
    </div>
</div>
</body>
</html>
